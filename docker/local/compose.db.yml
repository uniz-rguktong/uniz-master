# Hot-reload local: Postgres + Redis only (no app containers).
# Used by: npm run setup:local / scripts/local/setup-local.sh
#
# Full stack demo: make up → docker/local/compose.yml
# Production:       K3s via GitHub Actions (never this file)

services:
  uniz-redis:
    image: redis:7-alpine
    container_name: uniz-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  uniz-postgres:
    image: postgres:17-alpine
    container_name: uniz-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-uniz_db}
    volumes:
      - uniz_local_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-uniz_db}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  uniz_local_pg_data:
