[project]
name = "uniz-landing-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "bcrypt==5.0.0",
    "cloudinary>=1.44.1",
    "dotenv>=0.9.9",
    "passlib>=1.7.4",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.12.5",
    "PyJWT[crypto]>=2.13.0",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.27",
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "idna>=3.18",
    "uvicorn>=0.41.0",
    "requests>=2.32.5",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi-cache2>=0.2.2",
    "jinja2>=3.1.2",
]

# Unit tests: uv run --extra test pytest
[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "greenlet>=3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=config --cov=database --cov=dependencies --cov=main --cov=migrate --cov=models --cov=schemas --cov=routers --cov-report=term-missing --cov-report=json:coverage/coverage.json --cov-branch"
