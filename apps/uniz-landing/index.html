<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("uniz-landing-theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = pref === "dark" || (pref !== "light" && systemDark);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IIIT Ongole :: RGUKT-AP</title>
  <meta name="description" content="Rajiv Gandhi University of Knowledge Technologies, Ongole Campus. Academics, departments, notifications, tenders and campus life." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
