    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        background: linear-gradient(165deg, #fafafa 0%, #f4f4f5 48%, #fafafa 100%);
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      #pwa-splash.pwa-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #pwa-splash .pwa-splash-wordmark {
        font-family: "Pattaya", "Georgia", "Times New Roman", cursive;
        font-size: clamp(2.5rem, 10vw, 3.25rem);
        line-height: 1;
        color: #0b2a47;
        margin: 0 0 0.25rem;
      }

      #pwa-splash .pwa-splash-tagline {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.125rem;
        margin: 0;
        padding: 0 1.25rem;
        max-width: 20rem;
        text-align: center;
      }

      #pwa-splash .pwa-splash-tagline-line {
        font-family: "Pattaya", "Georgia", "Times New Roman", cursive;
        font-size: clamp(1.125rem, 4.8vw, 1.5rem);
        line-height: 1.25;
        color: #27272a;
        margin: 0;
      }

      #pwa-splash .pwa-splash-tagline-line--muted {
        color: #71717a;
      }

      #pwa-splash .pwa-splash-sub {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #71717a;
        margin: 0;
      }

      #pwa-splash .pwa-splash-bar {
        position: absolute;
        bottom: max(2.75rem, env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: 2.75rem;
        height: 2px;
        border-radius: 999px;
        background: #e4e4e7;
        overflow: hidden;
      }

      #pwa-splash .pwa-splash-bar span {
        display: block;
        height: 100%;
        width: 45%;
        border-radius: inherit;
        background: #27272a;
        animation: pwa-splash-slide 1.15s ease-in-out infinite;
      }

      @keyframes pwa-splash-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      /* Splash is for mobile PWA/TWA only — never on large desktop viewports */
      @media (min-width: 1024px) {
        #pwa-splash {
          display: none !important;
        }
      }

      html.pwa-splash-off #pwa-splash {
        display: none !important;
      }
    </style>

    <script>
      (function () {
        var isLargeViewport = window.matchMedia("(min-width: 1024px)").matches;
        var isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true;
        if (isLargeViewport && !isStandalone) {
          document.documentElement.classList.add("pwa-splash-off");
        }
      })();
    </script>

    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.log("[PWA] Early event capture successful");
        window.dispatchEvent(
          new CustomEvent("pwa-prompt-ready", { detail: e }),
        );
      });
    </script>
