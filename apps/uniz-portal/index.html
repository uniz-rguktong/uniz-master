    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #ffffff;
        color: #0f172a;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      #pwa-splash.pwa-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #pwa-splash .pwa-splash-lockup {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #pwa-splash .pwa-splash-lockup img {
        width: 2.75rem;
        height: 2.75rem;
        object-fit: contain;
      }

      #pwa-splash .pwa-splash-wordmark {
        font-family: "Cabin Condensed", system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-transform: none;
        font-size: 1.5rem;
        line-height: 1;
        color: #0a2540;
        margin: 0;
      }

      #pwa-splash .pwa-splash-sub {
        font-family: "Cabin Condensed", system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        color: #475569;
        margin: 0.25rem 0 0;
      }

      #pwa-splash .pwa-splash-status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin: 0;
      }

      #pwa-splash .pwa-splash-spin {
        width: 2.5rem;
        height: 2.5rem;
        border: 2px solid #0a2540;
        border-top-color: transparent;
        border-radius: 999px;
        animation: pwa-splash-spin 0.7s linear infinite;
      }

      #pwa-splash .pwa-splash-status p {
        font-family: "Cabin Condensed", system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0;
        color: #475569;
        margin: 0;
      }

      #pwa-splash .pwa-splash-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: #e2e8f0;
        overflow: hidden;
      }

      #pwa-splash .pwa-splash-bar span {
        display: block;
        height: 100%;
        width: 32%;
        background: #ea2027;
        animation: pwa-splash-slide 1.15s ease-in-out infinite;
      }

      @keyframes pwa-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pwa-splash-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-splash .pwa-splash-spin,
        #pwa-splash .pwa-splash-bar span {
          animation: none;
        }
      }

      /* Splash is for mobile PWA/TWA only — never on large desktop viewports */
      @media (min-width: 1024px) {
        #pwa-splash {
          display: none !important;
        }
      }

      html.pwa-splash-off #pwa-splash {
        display: none !important;
      }
    </style>

    <script>
      (function () {
        var isLargeViewport = window.matchMedia("(min-width: 1024px)").matches;
        var isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true;
        if (isLargeViewport && !isStandalone) {
          document.documentElement.classList.add("pwa-splash-off");
        }
      })();
    </script>

    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.log("[PWA] Early event capture successful");
        window.dispatchEvent(
          new CustomEvent("pwa-prompt-ready", { detail: e }),
        );
      });
    </script>
