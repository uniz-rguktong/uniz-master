# Fast static docs — health endpoint + VitePress dist under /docs/
server {
    listen 3333;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"uniz-docs-service"}';
    }

    # Gateway / Traefik often strip or keep /docs prefix
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ $uri.html /docs/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html /docs/index.html;
    }
}
