name: Deploy Frontends to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/uniz-portal/**"
      - "apps/uniz-landing/**"
      - "packages/uniz-shared/**"
      - "scripts/deploy/deploy-cloudflare-pages.sh"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which frontend(s) to deploy"
        required: true
        default: all
        type: choice
        options: [all, portal, landing]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: |
          npm ci --legacy-peer-deps
          # npm ci can skip platform-specific optional deps when the lockfile
          # was generated on macOS; tailwind v4 needs the Linux binary.
          npm i --no-save --legacy-peer-deps lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MAINTENANCE_MODE: ${{ secrets.VITE_MAINTENANCE_MODE }}
          VITE_ENABLE_OUTPASS_OUTING: ${{ secrets.VITE_ENABLE_OUTPASS_OUTING }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          VITE_LANDING_API_URL: ${{ secrets.VITE_LANDING_API_URL }}
        run: |
          # Production defaults if secrets empty
          export VITE_API_URL="${VITE_API_URL:-https://api-uniz.rguktong.in/api/v1}"
          export VITE_LANDING_API_URL="${VITE_LANDING_API_URL:-https://landing-api.rguktong.in}"
          export VITE_MAINTENANCE_MODE="${VITE_MAINTENANCE_MODE:-false}"
          export VITE_ENABLE_OUTPASS_OUTING="${VITE_ENABLE_OUTPASS_OUTING:-false}"
          TARGET="${{ github.event.inputs.target || 'all' }}"
          bash scripts/deploy/deploy-cloudflare-pages.sh "$TARGET"
