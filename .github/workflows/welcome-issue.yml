name: Issue welcome

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ github.token }}
          issue-message: |
            Thanks for opening your first issue here. Someone will triage it soon.
            If it's a bug, steps to reproduce and a screenshot help a lot. If you want to fix it yourself, say so and we'll assign it to you.
