# Push to main → compile gate → GHCR image build/push → VPS pull + kubectl rollout.
name: VPS Automated Deployment

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for rebuilding (optional)"
        required: false
        default: "manual-update"

jobs:
  ci:
    name: Build monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build backend services
        run: npm run ci:build

      - name: Build portal
        run: npm run build -w uniz

  plan-build:
    name: Plan GHCR image builds
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      has_builds: ${{ steps.plan.outputs.has_builds }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache/restore@v4
        id: deploy-sha-cache
        with:
          path: |
            .uniz-last-deploy-sha
            .uniz-k8s-image-tags.json
          key: uniz-deploy-state-${{ github.ref_name }}
          restore-keys: |
            uniz-deploy-state-${{ github.ref_name }}-

      - name: Export cached last successful deploy SHA
        run: |
          if [ -f .uniz-last-deploy-sha ]; then
            SHA=$(tr -d '[:space:]' < .uniz-last-deploy-sha)
            echo "LAST_SUCCESSFUL_DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
            echo "[Cache] Last successful deploy SHA: ${SHA:0:7}"
          else
            echo "[Cache] No cached deploy SHA — will use VPS manifest / push fallback"
          fi

      - name: Fetch live VPS image manifest
        continue-on-error: true
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" \
            'WORK_DIR="/root/uniz-master-main"; [ -f /root/.uniz_k8s_image_tags.json ] || { [ -d "$WORK_DIR" ] && bash "$WORK_DIR/scripts/deploy/dump-k8s-image-tags.sh" /root/.uniz_k8s_image_tags.json || true; }'
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/root/.uniz_k8s_image_tags.json" \
            .uniz-k8s-image-tags.json 2>/dev/null || true
          if [ ! -f .uniz-k8s-image-tags.json ]; then
            echo "{}" > .uniz-k8s-image-tags.json
          fi
          echo "[VPS] Loaded deployed image manifest ($(wc -c < .uniz-k8s-image-tags.json) bytes)"

      - name: Plan parallel image builds
        id: plan
        env:
          DEPLOY_CONTEXT: GITHUB_ACTIONS
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BEFORE_SHA: ${{ github.event.before }}
          LAST_SUCCESSFUL_DEPLOY_SHA: ${{ env.LAST_SUCCESSFUL_DEPLOY_SHA }}
          K8S_IMAGE_MANIFEST: .uniz-k8s-image-tags.json
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: bash scripts/ci/ci-plan-build-matrix.sh

  build-image:
    name: Build ${{ matrix.img }}
    needs: plan-build
    if: needs.plan-build.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan-build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          DEPLOY_CONTEXT: GITHUB_ACTIONS
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_MAINTENANCE_MODE: ${{ secrets.VITE_MAINTENANCE_MODE }}
          VITE_ENABLE_OUTPASS_OUTING: ${{ secrets.VITE_ENABLE_OUTPASS_OUTING }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          VITE_SCRAPER_URL: ${{ secrets.VITE_SCRAPER_URL }}
        run: bash scripts/ci/ci-build-one-image.sh "${{ matrix.dir }}" "${{ matrix.img }}"

  deploy:
    name: Deploy to VPS
    needs: [ci, plan-build, build-image]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.plan-build.result == 'success' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    # Self-hosted runner on the VPS avoids SSH from GitHub cloud (Hostinger blocks many GHA IPs).
    runs-on: [self-hosted, linux, uniz-vps]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy on VPS (local runner)
        id: vps_deploy
        env:
          JWT_SECURITY_KEY: ${{ secrets.JWT_SECURITY_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          INTERNAL_BOT_SECRET: ${{ secrets.INTERNAL_BOT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          USER_DATABASE_URL: ${{ secrets.USER_DATABASE_URL }}
          ACADEMICS_DATABASE_URL: ${{ secrets.ACADEMICS_DATABASE_URL }}
          OUTPASS_DATABASE_URL: ${{ secrets.OUTPASS_DATABASE_URL }}
          FILES_DATABASE_URL: ${{ secrets.FILES_DATABASE_URL }}
          MAIL_DATABASE_URL: ${{ secrets.MAIL_DATABASE_URL }}
          NOTIFICATION_DATABASE_URL: ${{ secrets.NOTIFICATION_DATABASE_URL }}
          CRON_DATABASE_URL: ${{ secrets.CRON_DATABASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MAINTENANCE_MODE: ${{ secrets.VITE_MAINTENANCE_MODE }}
          VITE_ENABLE_OUTPASS_OUTING: ${{ secrets.VITE_ENABLE_OUTPASS_OUTING }}
          VITE_SCRAPER_URL: ${{ secrets.VITE_SCRAPER_URL }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          INSTITUTION_LOGO_URL: ${{ secrets.INSTITUTION_LOGO_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          LANDING_POSTGRES_USER: ${{ secrets.LANDING_POSTGRES_USER }}
          LANDING_POSTGRES_PASSWORD: ${{ secrets.LANDING_POSTGRES_PASSWORD }}
          LANDING_POSTGRES_DB: ${{ secrets.LANDING_POSTGRES_DB }}
          LANDING_DATABASE_URL: ${{ secrets.LANDING_DATABASE_URL }}
          LANDING_JWT_SECURITY_KEY: ${{ secrets.LANDING_JWT_SECURITY_KEY }}
          LANDING_JWT_ALGORITHM: ${{ secrets.LANDING_JWT_ALGORITHM }}
          DUMMY_TOKEN: ${{ secrets.DUMMY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/ci/ci-local-deploy.sh

      - name: Fetch VPS image manifest after deploy
        if: success() && steps.vps_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          cp /root/.uniz_k8s_image_tags.json .uniz-k8s-image-tags.json 2>/dev/null || echo "{}" > .uniz-k8s-image-tags.json

      - name: Record successful deploy SHA
        if: success() && steps.vps_deploy.outcome == 'success'
        run: echo "${{ github.sha }}" > .uniz-last-deploy-sha

      - uses: actions/cache/save@v4
        if: success() && steps.vps_deploy.outcome == 'success'
        with:
          path: |
            .uniz-last-deploy-sha
            .uniz-k8s-image-tags.json
          key: uniz-deploy-state-${{ github.ref_name }}-${{ github.sha }}
