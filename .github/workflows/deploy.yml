name: VPS Automated Deployment

concurrency:
  group: vps-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for rebuilding (optional)"
        required: false
        default: "manual-update"

jobs:
  ci:
    name: Build monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build backend services
        run: npm run ci:build

  deploy:
    name: Build and Stream to VPS
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Secrets and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          # --- CORE SECRETS ---
          JWT_SECURITY_KEY: ${{ secrets.JWT_SECURITY_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          INTERNAL_BOT_SECRET: ${{ secrets.INTERNAL_BOT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

          # email / comms
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

          # storage / media
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

          # push
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

          # database
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          USER_DATABASE_URL: ${{ secrets.USER_DATABASE_URL }}
          ACADEMICS_DATABASE_URL: ${{ secrets.ACADEMICS_DATABASE_URL }}
          OUTPASS_DATABASE_URL: ${{ secrets.OUTPASS_DATABASE_URL }}
          FILES_DATABASE_URL: ${{ secrets.FILES_DATABASE_URL }}
          MAIL_DATABASE_URL: ${{ secrets.MAIL_DATABASE_URL }}
          NOTIFICATION_DATABASE_URL: ${{ secrets.NOTIFICATION_DATABASE_URL }}
          CRON_DATABASE_URL: ${{ secrets.CRON_DATABASE_URL }}

          # portal specific
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MAINTENANCE_MODE: ${{ secrets.VITE_MAINTENANCE_MODE }}
          VITE_SCRAPER_URL: ${{ secrets.VITE_SCRAPER_URL }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          INSTITUTION_LOGO_URL: ${{ secrets.INSTITUTION_LOGO_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

          # analytics db
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}

          # landing backend
          LANDING_POSTGRES_USER: ${{ secrets.LANDING_POSTGRES_USER }}
          LANDING_POSTGRES_PASSWORD: ${{ secrets.LANDING_POSTGRES_PASSWORD }}
          LANDING_POSTGRES_DB: ${{ secrets.LANDING_POSTGRES_DB }}
          LANDING_DATABASE_URL: ${{ secrets.LANDING_DATABASE_URL }}
          LANDING_JWT_SECURITY_KEY: ${{ secrets.LANDING_JWT_SECURITY_KEY }}
          LANDING_JWT_ALGORITHM: ${{ secrets.LANDING_JWT_ALGORITHM }}
          DUMMY_TOKEN: ${{ secrets.DUMMY_TOKEN }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          envs: JWT_SECURITY_KEY,INTERNAL_SECRET,INTERNAL_BOT_SECRET,REDIS_URL,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,SES_FROM_EMAIL,EMAIL_USER,EMAIL_PASS,CLOUDINARY_CLOUD_NAME,CLOUDINARY_UPLOAD_PRESET,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_UPLOAD_PRESET,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,POSTGRES_USER,POSTGRES_PASSWORD,AUTH_DATABASE_URL,USER_DATABASE_URL,ACADEMICS_DATABASE_URL,OUTPASS_DATABASE_URL,FILES_DATABASE_URL,MAIL_DATABASE_URL,NOTIFICATION_DATABASE_URL,CRON_DATABASE_URL,VITE_API_URL,VITE_MAINTENANCE_MODE,VITE_SCRAPER_URL,VITE_ANALYTICS_URL,VITE_ANALYTICS_API_KEY,INSTITUTION_LOGO_URL,VITE_TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,DB_USER,DB_PASS,DB_HOST,DB_PORT,DB_NAME,LANDING_POSTGRES_USER,LANDING_POSTGRES_PASSWORD,LANDING_POSTGRES_DB,LANDING_DATABASE_URL,LANDING_JWT_SECURITY_KEY,LANDING_JWT_ALGORITHM,DUMMY_TOKEN,CLOUDFLARE_API_TOKEN,GITHUB_REF_NAME
          script: |
            export DEPLOY_CONTEXT="GITHUB_ACTIONS"
            export WORK_DIR="/root/uniz-master-$GITHUB_REF_NAME"

            # Setup isolated branch directory
            if [ ! -d "$WORK_DIR" ]; then
              echo "[Setup] Creating isolated directory for $GITHUB_REF_NAME..."
              git clone https://github.com/uniz-rguktong/uniz-master.git "$WORK_DIR"
            fi

            cd "$WORK_DIR"

            echo "[Security] Regenerating secrets.env from GitHub Secrets..."
            cat <<EOF > /root/uniz-secrets.env
            # Generated by GitHub Actions - Do not edit manually
            JWT_SECURITY_KEY="$JWT_SECURITY_KEY"
            INTERNAL_SECRET="$INTERNAL_SECRET"
            INTERNAL_BOT_SECRET="$INTERNAL_BOT_SECRET"
            REDIS_URL="$REDIS_URL"
            AWS_REGION="$AWS_REGION"
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            SES_FROM_EMAIL="$SES_FROM_EMAIL"
            EMAIL_USER="$EMAIL_USER"
            EMAIL_PASS="$EMAIL_PASS"
            CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME"
            CLOUDINARY_UPLOAD_PRESET="$CLOUDINARY_UPLOAD_PRESET"
            VITE_CLOUDINARY_CLOUD_NAME="$VITE_CLOUDINARY_CLOUD_NAME"
            VITE_CLOUDINARY_UPLOAD_PRESET="$VITE_CLOUDINARY_UPLOAD_PRESET"
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY"
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY"
            POSTGRES_USER="$POSTGRES_USER"
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
            AUTH_DATABASE_URL="$AUTH_DATABASE_URL"
            USER_DATABASE_URL="$USER_DATABASE_URL"
            ACADEMICS_DATABASE_URL="$ACADEMICS_DATABASE_URL"
            OUTPASS_DATABASE_URL="$OUTPASS_DATABASE_URL"
            FILES_DATABASE_URL="$FILES_DATABASE_URL"
            MAIL_DATABASE_URL="$MAIL_DATABASE_URL"
            NOTIFICATION_DATABASE_URL="$NOTIFICATION_DATABASE_URL"
            CRON_DATABASE_URL="$CRON_DATABASE_URL"
            VITE_API_URL="$VITE_API_URL"
            VITE_MAINTENANCE_MODE="$VITE_MAINTENANCE_MODE"
            VITE_SCRAPER_URL="$VITE_SCRAPER_URL"
            VITE_ANALYTICS_URL="$VITE_ANALYTICS_URL"
            VITE_ANALYTICS_API_KEY="$VITE_ANALYTICS_API_KEY"
            INSTITUTION_LOGO_URL="$INSTITUTION_LOGO_URL"
            VITE_TURNSTILE_SITE_KEY="$VITE_TURNSTILE_SITE_KEY"
            TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY"
            DB_USER="$DB_USER"
            DB_PASS="$DB_PASS"
            DB_HOST="$DB_HOST"
            DB_PORT="$DB_PORT"
            DB_NAME="$DB_NAME"
            LANDING_POSTGRES_USER="$LANDING_POSTGRES_USER"
            LANDING_POSTGRES_PASSWORD="$LANDING_POSTGRES_PASSWORD"
            LANDING_POSTGRES_DB="$LANDING_POSTGRES_DB"
            LANDING_DATABASE_URL="$LANDING_DATABASE_URL"
            LANDING_JWT_SECURITY_KEY="$LANDING_JWT_SECURITY_KEY"
            LANDING_JWT_ALGORITHM="$LANDING_JWT_ALGORITHM"
            DUMMY_TOKEN="$DUMMY_TOKEN"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"
            EOF
            chmod 600 /root/uniz-secrets.env

            echo "[CI/CD] Triggered by ${{ github.actor }} on commit ${{ github.sha }}"

            # Security: Verify repo integrity
            git fetch origin $GITHUB_REF_NAME
            git checkout -B $GITHUB_REF_NAME origin/$GITHUB_REF_NAME
            git reset --hard origin/$GITHUB_REF_NAME
            git clean -fd

            # Extract commit message for build-detection
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "[Log] Last Commit: $COMMIT_MSG"

            # Execute the heavy lifter
            /bin/bash ./scripts/deploy.sh "$COMMIT_MSG"
