name: CI

# PR gate only. Pushes to main are built and deployed by deploy.yml.
# Runs with a read-only token and no secrets, so it's safe for fork PRs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build backend services
        run: npm run ci:build

      - name: Build portal
        run: npm run build -w uniz

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prettier (shared package and workflows)
        run: npx prettier --check packages/uniz-shared .github
      # Landing has known lint errors. Non-blocking until they're fixed,
      # then drop continue-on-error.
      - name: ESLint landing
        continue-on-error: true
        run: npm run lint -w uniz-landing

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Shared package
        run: npx tsc --noEmit -p packages/uniz-shared
      - name: Landing
        run: npx tsc -b apps/uniz-landing
      # Portal has ~290 type errors, mostly from two @types/react versions
      # in the tree. Non-blocking until that's fixed.
      - name: Portal
        continue-on-error: true
        run: npm run build:shared && npm run typecheck -w uniz

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage -w @uniz/shared
      - name: Coverage summary
        if: always()
        run: |
          f=packages/uniz-shared/coverage/coverage-summary.json
          [ -f "$f" ] || exit 0
          node -e '
            const t = require("./'"$f"'").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage (@uniz/shared)", "", "| | % | covered |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-shared
          path: packages/uniz-shared/coverage/
          retention-days: 7
