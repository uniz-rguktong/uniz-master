name: CI

# PR gate only — pushes to main and staging are built and deployed by deploy.yml
on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scoped to shared until portal/landing are prettier-clean.
      - name: Prettier check (shared)
        run: npm run format:check

  lint:
    name: Lint frontends
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint landing (advisory until debt cleared)
        run: npm run lint -w uniz-landing

  hex:
    name: Hex lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hex lint landing
        run: npm run lint:hex -w uniz-landing

      - name: Hex lint portal
        run: npm run lint:hex -w uniz

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck portal (advisory until debt cleared)
        run: npm run typecheck -w uniz

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run unit tests
        run: npm test

  build:
    name: Build monorepo
    runs-on: ubuntu-latest
    needs: [format, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build backend services
        run: npm run ci:build

      - name: Build portal
        run: npm run build -w uniz

  # Optional layout sweep. Failures are reported as artifacts and do not block merge.
  responsive:
    name: Responsive audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit portal, landing, and docs
        run: npm run audit:responsive

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-audit
          path: scripts/responsive-audit/out
          if-no-files-found: ignore
