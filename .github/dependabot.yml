version: 2
updates:
  # One root entry covers every npm workspace through the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need a human, Dependabot opens security PRs for these anyway.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /apps/uniz-landing-backend
    schedule:
      interval: monthly
    labels: [dependencies, area/landing]
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]
