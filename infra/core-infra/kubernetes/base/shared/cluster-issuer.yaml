# HTTP-01 issuer — works only when Cloudflare proxy is OFF (grey cloud / DNS-only).
# For orange-cloud (proxied) domains use letsencrypt-prod-dns (cluster-issuer-dns.yaml).
#
# Grey-cloud fallback (no API token): in Cloudflare DNS set all cert hosts to DNS-only,
# delete failed challenges/orders/certificaterequests/certificate, wait for HTTP-01 renewal,
# then re-enable proxy. Hosts: rguktong.in, uniz.rguktong.in, api.uniz.rguktong.in,
# ornate-core.rguktong.in, ornate.rguktong.in, landing-api.rguktong.in
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: webadmin@rguktong.ac.in
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
