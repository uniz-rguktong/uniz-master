apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uniz-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod-dns"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # Frontends (portal + landing SPA) live on Cloudflare Pages.
        # VPS ingress serves APIs only.
        - api-uniz.rguktong.in
        - www.api.uniz.rguktong.in
        - landing-api.rguktong.in
        - www.landing-api.rguktong.in
      secretName: uniz-tls-cert
  rules:
    - host: api-uniz.rguktong.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uniz-gateway
                port:
                  number: 80
    - host: landing-api.rguktong.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uniz-landing-backend-svc
                port:
                  number: 8000
