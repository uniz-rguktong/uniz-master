apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-docs-service
  labels:
    app: uniz-docs-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uniz-docs-service
  template:
    metadata:
      labels:
        app: uniz-docs-service
    spec:
      priorityClassName: uniz-high-priority
      containers:
        - name: docs-service
          image: uniz-docs-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3333
          resources:
            limits:
              cpu: "500m"
              memory: "1Gi"
            requests:
              cpu: "50m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: 3333
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 3333
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-docs-service
spec:
  selector:
    app: uniz-docs-service
  ports:
    - protocol: TCP
      port: 3333
      targetPort: 3333
