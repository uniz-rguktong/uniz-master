apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-outpass-service
  labels:
    app: uniz-outpass-service
spec:
  # Scaled to 0: grievance moved to user-service; outpass/outing API gated off.
  # Code + CronJob image (maintenance) remain. Scale up when ENABLE_OUTPASS_OUTING=true.
  # No HPA while parked (HPA minReplicas would fight replicas: 0).
  replicas: 0
  selector:
    matchLabels:
      app: uniz-outpass-service
  template:
    metadata:
      labels:
        app: uniz-outpass-service
    spec:
      containers:
        - name: outpass-service
          image: uniz-outpass-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uniz-secrets
                  key: OUTPASS_DATABASE_URL
          envFrom:
            - configMapRef:
                name: uniz-config
            - secretRef:
                name: uniz-secrets
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-outpass-service
spec:
  selector:
    app: uniz-outpass-service
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
