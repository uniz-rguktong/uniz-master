apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-landing
  labels:
    app: uniz-landing
spec:
  # PARKED — production landing is Cloudflare Pages (rguktong.in / www).
  # Ship via Pages workflow. Keep replicas 0; no HPA.
  replicas: 0
  selector:
    matchLabels:
      app: uniz-landing
  template:
    metadata:
      labels:
        app: uniz-landing
    spec:
      containers:
        - name: landing
          image: uniz-landing:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-landing
spec:
  selector:
    app: uniz-landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
