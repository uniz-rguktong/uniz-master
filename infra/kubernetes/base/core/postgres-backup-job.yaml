apiVersion: batch/v1
kind: CronJob
metadata:
  name: uniz-postgres-backup
  labels:
    app: uniz-postgres-backup
spec:
  # Daily 01:30 — adjust timezone via cluster TZ.
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  # Dump every distinct service database (many share one instance,
                  # so dedupe by URL). A single failing DB never fails the whole job.
                  seen=""
                  for VAR in AUTH_DATABASE_URL USER_DATABASE_URL OUTPASS_DATABASE_URL \
                             ACADEMICS_DATABASE_URL FILES_DATABASE_URL MAIL_DATABASE_URL \
                             NOTIFICATION_DATABASE_URL CRON_DATABASE_URL; do
                    URL=$(printenv "$VAR" 2>/dev/null || true)
                    [ -z "$URL" ] && continue
                    case " $seen " in *" $URL "*) continue ;; esac
                    seen="$seen $URL"
                    NAME=$(echo "$VAR" | sed 's/_DATABASE_URL//' | tr 'A-Z' 'a-z')
                    OUT="/backups/uniz-${NAME}_${STAMP}.sql.gz"
                    echo "Dumping $NAME -> $OUT"
                    if pg_dump "$URL" | gzip -c >"$OUT"; then
                      ls -lh "$OUT"
                    else
                      echo "WARN: dump failed for $NAME"; rm -f "$OUT"
                    fi
                  done
                  # Retain ~14 days of DB snapshots.
                  find /backups -name 'uniz-*_*.sql.gz' -mtime +14 -delete || true
              envFrom:
                - secretRef:
                    name: uniz-secrets
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              hostPath:
                path: /var/backups/uniz
                type: DirectoryOrCreate
