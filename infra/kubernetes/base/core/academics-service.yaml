apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-academics-service
  labels:
    app: uniz-academics-service
spec:
  # Parked after uniz-api cutover — flip ConfigMap back + scale up to roll back.
  replicas: 0
  selector:
    matchLabels:
      app: uniz-academics-service
  template:
    metadata:
      labels:
        app: uniz-academics-service
    spec:
      priorityClassName: uniz-high-priority
      containers:
        - name: academics-service
          image: uniz-academics-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uniz-secrets
                  key: ACADEMICS_DATABASE_URL
          envFrom:
            - configMapRef:
                name: uniz-config
            - secretRef:
                name: uniz-secrets
          resources:
            limits:
              cpu: "1500m"
              memory: "1536Mi"
            requests:
              cpu: "250m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-academics-service
spec:
  selector:
    app: uniz-academics-service
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004
# HPA removed: parked at replicas 0 (K3s rejects minReplicas: 0 without external metrics).
