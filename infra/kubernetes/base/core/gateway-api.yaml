apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-gateway-api
  labels:
    app: uniz-gateway-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Stay serving on the current pod until the replacement is ready.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: uniz-gateway-api
  template:
    metadata:
      labels:
        app: uniz-gateway-api
    spec:
      priorityClassName: uniz-high-priority
      containers:
        - name: gateway-api
          image: uniz-gateway-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: uniz-config
            - secretRef:
                name: uniz-secrets
          resources:
            # Single 4-vCPU node. 250m × min 2 leaves room for Postgres,
            # Redis, cloudflared, and Traefik. HPA targets 60% of this
            # request so a small spike does not scale on 45% of 200m.
            limits:
              cpu: "1000m"
              memory: "768Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-gateway-api
spec:
  selector:
    app: uniz-gateway-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uniz-gateway-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uniz-gateway-api
  # Single 4-vCPU VPS: keep gateway as the primary scale absorber.
  # Floor of 2 matches the Deployment so a rollout never starts from one pod.
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 200
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: uniz-gateway-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: uniz-gateway-api
