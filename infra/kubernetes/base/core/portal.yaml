apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-portal
  labels:
    app: uniz-portal
spec:
  # Frontend on Cloudflare Pages. Keep image path for emergency rollback only.
  # No HPA while replicas: 0.
  replicas: 0
  selector:
    matchLabels:
      app: uniz-portal
  template:
    metadata:
      labels:
        app: uniz-portal
    spec:
      priorityClassName: uniz-medium-priority
      containers:
        - name: portal
          image: uniz-portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-portal
spec:
  selector:
    app: uniz-portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
