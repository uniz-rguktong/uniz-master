apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-gateway
  labels:
    app: uniz-gateway
spec:
  # Parked: Traefik ingress → uniz-gateway-api directly (no nginx hop).
  # Keep Deployment for rollback: scale up + point ingress back at this Service.
  replicas: 0
  selector:
    matchLabels:
      app: uniz-gateway
  template:
    metadata:
      labels:
        app: uniz-gateway
    spec:
      priorityClassName: uniz-high-priority
      containers:
        - name: gateway-nginx
          image: uniz-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-gateway
spec:
  selector:
    app: uniz-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
