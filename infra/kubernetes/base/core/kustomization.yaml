apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - academics-service.yaml
  - auth-service.yaml
  - cron-job.yaml
  # Always-on cron Deployment retired — storage cleanup runs as CronJob only.
  # - cron-service.yaml
  # Files folded into user-service (FILES_SERVICE_URL → user)
  # - files-service.yaml
  - gateway-api.yaml
  # PARKED replicas:0 — nginx hop removed (Traefik → gateway-api). Keep for rollback.
  - gateway.yaml
  # Mail folded into notification/comms (MAIL_SERVICE_URL → notifications)
  # - mail-service.yaml
  - notification-service.yaml
  # PARKED replicas:0 — outing off; Service retained for grievance URL DNS.
  - outpass-service.yaml
  # PARKED replicas:0 — production FE on Cloudflare Pages.
  - portal.yaml
  - storage-cleanup-job.yaml
  - postgres-backup-job.yaml
  - uploads-backup-job.yaml
  - postgres-analyze-job.yaml
  - redis.yaml
  - user-service.yaml
  - docs-service.yaml
  - dbadmin-service.yaml
  - adminer.yaml
  - dbadmin-role-cronjob.yaml
  # PARKED replicas:0 — production landing on Cloudflare Pages.
  - landing.yaml
  # Legacy uniz-api monolith removed from cluster (traffic uses microservices).

configMapGenerator:
  - name: uniz-dbadmin-role-sql
    files:
      - ensure-dbadmin-role.sql=../../../../scripts/ops/ensure-dbadmin-role.sql
      - ensure-dbadmin-role.sh=../../../../scripts/ops/ensure-dbadmin-role.sh

generatorOptions:
  disableNameSuffixHash: true
