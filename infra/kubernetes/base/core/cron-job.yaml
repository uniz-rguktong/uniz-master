apiVersion: batch/v1
kind: CronJob
metadata:
  name: uniz-maintenance-job
spec:
  schedule: "0 2 * * *" # Run daily at 2:00 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cron-worker
              image: uniz-outpass-service:local
              imagePullPolicy: IfNotPresent
              command:
                [
                  "node",
                  "-e",
                  "require('./dist/jobs/maintenance.js').runMaintenance().then(() => process.exit(0))",
                ]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: uniz-secrets
                      key: OUTPASS_DATABASE_URL
              envFrom:
                - configMapRef:
                    name: uniz-config
                - secretRef:
                    name: uniz-secrets
          restartPolicy: OnFailure
