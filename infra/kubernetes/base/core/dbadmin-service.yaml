apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-dbadmin-service
  labels:
    app: uniz-dbadmin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uniz-dbadmin-service
  template:
    metadata:
      labels:
        app: uniz-dbadmin-service
    spec:
      priorityClassName: uniz-medium-priority
      containers:
        - name: dbadmin-service
          image: uniz-dbadmin-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
          env:
            - name: PORT
              value: "3010"
            - name: DBADMIN_DB_USER
              value: uniz_dbadmin
            - name: DBADMIN_PG_HOST
              value: "10.42.0.1"
            - name: DBADMIN_PG_PORT
              value: "5432"
            - name: DBADMIN_PG_DATABASE
              value: uniz_db
            - name: DBADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uniz-secrets
                  key: DBADMIN_DB_PASSWORD
            - name: JWT_SECURITY_KEY
              valueFrom:
                secretKeyRef:
                  name: uniz-secrets
                  key: JWT_SECURITY_KEY
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-dbadmin-service
spec:
  selector:
    app: uniz-dbadmin-service
  ports:
    - name: http
      port: 3010
      targetPort: 3010
