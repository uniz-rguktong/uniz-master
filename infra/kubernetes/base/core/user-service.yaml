apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniz-user-service
  labels:
    app: uniz-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uniz-user-service
  template:
    metadata:
      labels:
        app: uniz-user-service
    spec:
      priorityClassName: uniz-medium-priority
      # The uploads hostPath is created as root:root by k3s (DirectoryOrCreate);
      # the app runs as uid 100 (uniz), so make the volume writable on start.
      initContainers:
        - name: fix-uploads-perms
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "mkdir -p /data/uploads && chown -R 100:101 /data/uploads && chmod 0775 /data/uploads"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      containers:
        - name: user-service
          image: uniz-user-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uniz-secrets
                  key: USER_DATABASE_URL
            # Self-hosted image uploads live on a persistent VPS volume and are
            # served back through the gateway at /api/v1/files/img/*.
            - name: UPLOADS_DIR
              value: "/data/uploads"
          envFrom:
            - configMapRef:
                name: uniz-config
            - secretRef:
                name: uniz-secrets
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      # hostPath persists uploaded images across pod restarts/redeploys on the
      # single-node VPS; shared by all user-service replicas on the node.
      volumes:
        - name: uploads
          hostPath:
            path: /var/lib/uniz/uploads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: uniz-user-service
spec:
  selector:
    app: uniz-user-service
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uniz-user-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uniz-user-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
