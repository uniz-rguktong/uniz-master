apiVersion: v1
kind: ConfigMap
metadata:
  name: uniz-config
data:
  NODE_ENV: "production"
  DOCKER_ENV: "true"
  # Outpass/outing API (/requests). Grievance stays on outpass service regardless.
  ENABLE_OUTPASS_OUTING: "false"
  GATEWAY_URL: "https://api-uniz.rguktong.in/api/v1"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "465"
  SMTP_SECURE: "true"
  # Non-secret config only. Credentials live in Secret/uniz-secrets
  # (synced from /root/uniz-secrets.env on the VPS). See docs/ops/SECRETS.md.
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_UPLOAD_PRESET: ""
  # Service Mappings (K8s internal DNS) — auth/user/academics → uniz-api
  UNIZ_API_URL: "http://uniz-api-service.default.svc.cluster.local:3001"
  AUTH_SERVICE_URL: "http://uniz-api-service.default.svc.cluster.local:3001"
  USER_SERVICE_URL: "http://uniz-api-service.default.svc.cluster.local:3001"
  ACADEMICS_SERVICE_URL: "http://uniz-api-service.default.svc.cluster.local:3001"
  OUTPASS_SERVICE_URL: "http://uniz-outpass-service.default.svc.cluster.local:3003"
  FILES_SERVICE_URL: "http://uniz-api-service.default.svc.cluster.local:3001"
  MAIL_SERVICE_URL: "http://uniz-notification-service.default.svc.cluster.local:3007"
  NOTIFICATION_SERVICE_URL: "http://uniz-notification-service.default.svc.cluster.local:3007"
  CRON_SERVICE_URL: "http://uniz-outpass-service.default.svc.cluster.local:3003"
  LANDING_API_URL: "http://uniz-landing-backend-svc.default.svc.cluster.local:8000"
  CLIENT_URL: "https://uniz.rguktong.in,https://www.uniz.rguktong.in,http://localhost:3000,http://localhost:5173"
  REDIS_URL: "redis://uniz-redis:6379"
  # VAPID_PUBLIC_KEY may be public; private key / SMTP / AWS / JWT → uniz-secrets only
